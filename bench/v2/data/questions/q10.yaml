id: q10
domain: pgx
question: "A kidney transplant recipient is being started on tacrolimus. CYP3A5 genotype is *1/*3 (CYP3A5 expresser, intermediate metabolizer). Compared with the standard weight-based starting dose, what does CPIC recommend?"
required_inputs:
  - gene: CYP3A5
  - diplotype: "*1/*3"
  - clinical_context: "de novo kidney transplant, tacrolimus initiation"
gold_answer:
  verdict: "increase the starting tacrolimus dose to 1.5 to 2 times the standard recommended starting dose (not to exceed 0.3 mg/kg/day), then titrate to therapeutic trough"
  phenotype: "CYP3A5 Intermediate Metabolizer (expresser)"
  cited_guideline: "CPIC@2015 (Birdwell et al., Clin Pharmacol Ther 2015;98:19-24, PMID 25801146)"
  rationale: "CYP3A5 expressers (carriers of at least one *1 allele) clear tacrolimus faster, reach lower troughs at standard doses, and take longer to reach therapeutic targets. The 2015 CPIC guideline recommends 1.5-2x the standard starting dose, capped at 0.3 mg/kg/day."
scoring_rubric:
  verdict_correct: 'recommends starting at 1.5x to 2x standard dose (or ~0.3 mg/kg/day) OR an increased dose; not standard or reduced'
  phenotype_correct: 'mentions Intermediate Metabolizer, expresser, or "CYP3A5 expresser"'
  guideline_cited_with_version: 'includes "CPIC" AND ("2015" OR "Birdwell")'
  variant_evidence_cited: 'mentions CYP3A5 *1, *3, or rs776746'
primary_reference_url: https://cpicpgx.org/guidelines/guideline-for-tacrolimus-and-cyp3a5/
